<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookShelf 📚</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span>📚</span>
        <span>BookShelf</span>
      </div>
      <p class="counter">
        <span id="count">0</span> libri in totale
      </p>
    </div>
  </header>

  <!-- LAYOUT PRINCIPALE -->
  <main class="main-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="card">
        <h2 class="card-title">Aggiungi un libro</h2>

        <!-- Messaggio di errore (nascosto di default) -->
        <p id="form-error" class="form-error hidden"></p>

        <div class="form-group">
          <label for="input-title">Titolo *</label>
          <input type="text" id="input-title" placeholder="Es. Il nome della rosa">
        </div>

        <div class="form-group">
          <label for="input-author">Autore</label>
          <input type="text" id="input-author" placeholder="Es. Umberto Eco">
        </div>

        <div class="form-group">
          <label for="input-genre">Genere</label>
          <select id="input-genre">
            <option value="">— Seleziona —</option>
            <option value="narrativa">Narrativa</option>
            <option value="saggistica">Saggistica</option>
            <option value="fantasy">Fantasy</option>
            <option value="fantascienza">Fantascienza</option>
            <option value="thriller">Thriller</option>
            <option value="altro">Altro</option>
          </select>
        </div>

        <button class="btn btn-primary" id="btn-add">
          + Aggiungi libro
        </button>
      </div>
    </aside>

    <!-- AREA CONTENUTO -->
    <section class="content-area">
      <div class="content-header">
        <h2>I tuoi libri</h2>
      </div>

      <!-- Loader (visibile durante il fetch iniziale) -->
      <div id="loader" class="loader hidden">
        <span class="loader-spinner"></span>
        <p>Caricamento libri…</p>
      </div>

      <!-- Stato vuoto (nascosto quando ci sono libri) -->
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">📖</div>
        <p>La tua libreria è vuota.</p>
        <p>Aggiungi il primo libro usando il form!</p>
      </div>

      <!-- Lista libri -->
      <ul id="book-list" class="book-list"></ul>
    </section>

  </main>


</body>

</html>
