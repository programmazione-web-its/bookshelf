<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <div class="logo">
      <span>📚</span>
      <span>BookShelf</span>
    </div>
    <!--
      totalCount è un computed() del service.
      Il template legge il valore chiamando totalCount() come una funzione.
    -->
    <p class="counter">
      <span>{{ totalCount() }}</span> libri in totale
    </p>
  </div>
</header>

<!-- LAYOUT PRINCIPALE -->
<main class="main-layout">

  <!-- SIDEBAR: form per aggiungere libri -->
  <aside class="sidebar">
    <app-book-form />
  </aside>

  <!-- CONTENT: lista libri -->
  <section class="content-area">
    <!--
      isLoading è un signal(): mostra lo spinner durante il fetch iniziale,
      poi cede il posto alla lista tramite @if/@else (sintassi Angular 17).
    -->
    @if (isLoading()) {
      <div class="loader">
        <span class="loader-spinner"></span>
        <p>Caricamento libri…</p>
      </div>
    } @else {
      <app-book-list [books]="books()" />
    }
  </section>

</main>
